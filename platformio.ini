; ============================================================================
; ESP32 Seven-Segment Display Controller - PlatformIO configuration
; ============================================================================
; Target : Generic ESP32 DevKit (ESP32-WROOM-32, 4 MB flash)
; Core   : Arduino ESP32 2.0.14
; Platform: espressif32 6.5.0
;
; NOTE: UART0 (GPIO1/GPIO3) is used for display segments.
; Serial monitor is intentionally disabled.
; ============================================================================

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; Partition configuration
board_build.partitions = partitions.csv

; Flash configuration
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.f_cpu = 240000000L

; Upload configuration
upload_speed = 921600

; Compiler configuration
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wno-unused-variable
    -Wno-unused-function

; No external libraries required
lib_deps =
